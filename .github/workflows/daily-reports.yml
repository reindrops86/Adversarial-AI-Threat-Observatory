name: Daily Adversarial AI Threat Reports

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install -r requirements.txt

      - name: Generate daily simulated investigation artifacts
        env:
          PYTHONPATH: .
        run: python -m app.main demo --write

      - name: Upload daily report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-adversarial-ai-threat-reports
          path: |
            reports/
            data/
            rules/
          if-no-files-found: error

      - name: Commit changed report artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data rules
          git diff --cached --quiet || git commit -m "Generate daily adversarial AI threat reports"
          git push